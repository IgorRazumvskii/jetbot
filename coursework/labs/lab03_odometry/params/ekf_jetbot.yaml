jetbot_lab03_ekf:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 0.35
    two_d_mode: true
    publish_tf: false
    print_diagnostics: true

    odom_frame: ekf_odom
    world_frame: ekf_odom
    base_link_frame: base_footprint

    # X, Y, Z, roll, pitch, yaw, vX, vY, vZ, vRoll, vPitch, vYaw, aX, aY, aZ.
    # Differential drive also observes near-zero lateral body velocity.
    odom0: /diffbot_base_controller/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true, true, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # RF2O observes the planar pose. The first observation sets the origin.
    odom1: /lab03/rf2o_for_ekf
    odom1_config: [true, true, false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false
    odom1_relative: true
    odom1_queue_size: 10
